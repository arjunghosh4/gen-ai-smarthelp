<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Response System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #28a745; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Automated Email Response System</h2>
        <form id="emailForm">
            <label for="customer_email">Recipient Email:</label>
            <input type="email" id="customer_email" name="customer_email" required>

            <label for="subject">Email Subject:</label>
            <input type="text" id="subject" name="subject" required>

            <label for="body">Email Body:</label>
            <textarea id="body" name="body" rows="4" required></textarea>

            <button type="button" onclick="sendEmail()">Send Email</button>
        </form>

        <h3>Response:</h3>
        <p id="responseText">Awaiting AI response...</p>
    </div>

    <script>
        function sendEmail() {
            var email = document.getElementById("customer_email").value;
            var subject = document.getElementById("subject").value;
            var body = document.getElementById("body").value;

            fetch("/send_email", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ customer_email: email, subject: subject, body: body })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("responseText").innerHTML = "<b>Predicted Category:</b> " + data.predicted_category + "<br><b>AI Response:</b> " + data.response;
            })
            .catch(error => console.error("Error:", error));
        }
    </script>

</body>
</html>
